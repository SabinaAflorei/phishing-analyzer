case: 03_credential_phish_spf_fail
expected_verdict: MALICIOUS
source: sintetic

# Coduri de dovezi obligatorii. Verdictul singur nu ajunge: doua cazuri pot
# iesi MALICIOUS din motive complet diferite, iar cand unul se strica vrei sa
# afli CARE semnal a disparut, nu doar ca eticheta finala s-a schimbat.
# Lista e o conditie de incluziune - analizorul poate produce si altele.
must_contain_evidence:
  - AUTH_FAILURE
  - REPLY_TO_MISMATCH
  - LINK_TEXT_MISMATCH

notes: |
  Phishing de credentiale. Domeniu lookalike: distributie-energ<b>le</b>.ro
  (l in loc de i). SPF fail, DKIM fail, DMARC fail. Reply-To pe alt domeniu
  decat From. Textul link-ului arata webmail.distributie-energie.ro, dar
  href-ul duce la reset-portal-energie.ru cu token de destinatar in URL.
