notes: |
  Phishing de credentiale. Domeniu lookalike: distributie-energ<b>le</b>.ro
  (l in loc de i). SPF fail, DKIM fail, DMARC fail. Reply-To pe alt domeniu
  decat From. Textul link-ului arata webmail.distributie-energie.ro, dar
  href-ul duce la reset-portal-energie.ru cu token de destinatar in URL.
