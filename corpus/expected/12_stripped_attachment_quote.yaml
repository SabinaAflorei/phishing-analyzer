case: 12_stripped_attachment_quote
expected_verdict: NEEDS_REVIEW
source: corpus/msg/3.msg

# Coduri de dovezi obligatorii. Verdictul singur nu ajunge: doua cazuri pot
# iesi MALICIOUS din motive complet diferite, iar cand unul se strica vrei sa
# afli CARE semnal a disparut, nu doar ca eticheta finala s-a schimbat.
# Lista e o conditie de incluziune - analizorul poate produce si altele.
must_contain_evidence:
  - INSUFFICIENT_EVIDENCE

notes: |
  BONUS - nu intra in cele 11 cazuri din criteriul de acceptanta.
  Cerere de oferta externa careia gateway-ul companiei i-a taiat
  atasamentul de tip arhiva, inlocuindu-l cu o nota de politica. Mesajul
  original nu mai exista, headerele lui nu au supravietuit forward-ului,
  iar To: e adresa expeditorului insusi (destinatari reali in BCC).
  Semnale amestecate si insuficiente -> escaladare. Il tii ca sa verifici
  ca analizorul nu forteaza un verdict cand nu are pe ce sa se sprijine.
