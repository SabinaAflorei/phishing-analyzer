case: 01_cyberready_forward
expected_verdict: SIMULATION
source: corpus/msg/1.msg

# Coduri de dovezi obligatorii. Verdictul singur nu ajunge: doua cazuri pot
# iesi MALICIOUS din motive complet diferite, iar cand unul se strica vrei sa
# afli CARE semnal a disparut, nu doar ca eticheta finala s-a schimbat.
# Lista e o conditie de incluziune - analizorul poate produce si altele.
must_contain_evidence:
  - CYBEREADY_SIMULATION

notes: |
  Simulare CyberReady, raportata prin forward inline. Headerele originale NU
  supravietuiesc forward-ului: raman doar liniile 'From:/Sent:/To:/Subject:'
  din corp. Fingerprint-ul se prinde pe URL-urile din corpul HTML
  (trck.cybeready.net, inner.website) si pe In-Reply-To/References, care
  pastreaza Message-ID-ul original @mta1.cybereadysmtp.com.
