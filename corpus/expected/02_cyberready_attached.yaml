case: 02_cyberready_attached
expected_verdict: SIMULATION
source: corpus/msg/2.msg

# Coduri de dovezi obligatorii. Verdictul singur nu ajunge: doua cazuri pot
# iesi MALICIOUS din motive complet diferite, iar cand unul se strica vrei sa
# afli CARE semnal a disparut, nu doar ca eticheta finala s-a schimbat.
# Lista e o conditie de incluziune - analizorul poate produce si altele.
must_contain_evidence:
  - CYBEREADY_SIMULATION

notes: |
  Aceeasi campanie ca 01, dar mesajul original vine ca atasament
  message/rfc822. Aici exista headerele complete: Authentication-Results
  (spf=Pass pentru crsmtp.notificaton.online), DKIM d=notificaton.online,
  Received de la mta1.cybereadysmtp.com (99.80.130.134) si header-ul X-CRPS.
  Perechea 01/02 arata exact de ce parser-ul trebuie sa trateze ambele forme.
