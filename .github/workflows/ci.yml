name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  # Criteriul de acceptanta (sectiunea 8.4) cere >70% pe parser si analizor.
  # Pana cand cele doua exista, pragul e 0 - altfel CI e rosu din prima zi,
  # pe cod pe care nu l-a scris nimeni inca. Il ridici la 70 in PR-ul care
  # termina analizorul, si de acolo ramane acolo.
  # TODO: analizorul e terminat de cateva commit-uri, deci momentul descris mai sus
  # a trecut - pragul e inca 0. Ridica-l la 70, dar DUPA ce adaugi testul care
  # compara verdictul real cu expected_verdict (vezi TODO din tests/test_corpus.py).
  # Daca il ridici inainte, CI devine rosu si o sa ajungi sa il dezactivezi, adica
  # exact ce incearca sa evite comentariul de mai sus.
  COV_MIN: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest --cov-fail-under=${{ env.COV_MIN }}
