name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  # Criteriul de acceptanta (sectiunea 8.4) cere >70% pe parser si analizor.
  # Pragul e pe intreg pachetul si e peste cerinta, pentru ca testele acopera
  # acum si baza de date, ingestia si dashboard-ul. Il ridici cand creste, nu il
  # cobori cand pica: daca CI devine rosu, lipsesc teste, nu e pragul prea mare.
  COV_MIN: "85"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src tests scripts
      - run: mypy
      # Corpusul real nu intra in git. Fara inlocuitorul sintetic, testele de
      # verdict s-ar sari, si tocmai ele verifica criteriul 8.1.
      - run: python3 scripts/make_synthetic_corpus.py
      - run: pytest --cov-fail-under=${{ env.COV_MIN }}
