name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

env:
  # Criteriul de acceptanta (sectiunea 8.4) cere >70% pe parser si analizor.
  # Pana cand cele doua exista, pragul e 0 - altfel CI e rosu din prima zi,
  # pe cod pe care nu l-a scris nimeni inca. Il ridici la 70 in PR-ul care
  # termina analizorul, si de acolo ramane acolo.
  COV_MIN: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest --cov-fail-under=${{ env.COV_MIN }}
