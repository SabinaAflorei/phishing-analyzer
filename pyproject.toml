[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-triage"
version = "0.1.0"
description = "Asistent local de triaj pentru mail-uri de phishing raportate"
requires-python = ">=3.12"

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Regulile cosmetice (E, W, I, N) si pasul `ruff format --check` sunt scoase
# intentionat: CI se uita la ce e gresit, nu la cum arata. Spatii pe linia
# goala, ordinea importurilor sau lungimea liniei nu mai fac build-ul rosu.
# Formatarea ramane disponibila manual, prin `make fmt`.
select = ["F", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = ["S101"]  # assert e ok in teste

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# Utilitare rulate manual, nu cod de productie: print-uri si cai relative ok.
"scripts/*" = ["T201", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["triage"]

[[tool.mypy.overrides]]
module = ["magic.*", "confusable_homoglyphs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
    -q
    --strict-markers
    --disable-socket
    --allow-unix-socket
    --cov=triage
    --cov-report=term-missing
"""
asyncio_default_fixture_loop_scope = "function"
markers = [
    "needs_ollama: test care are voie sa vorbeasca cu Ollama pe 127.0.0.1",
    "needs_loopback: test care porneste o bucla de evenimente (doar loopback, nimic extern)",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
