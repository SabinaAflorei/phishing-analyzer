# Analiza doar pe metadate. Fisierul NU se deschide si NU se executa.
#
# Toate cele trei liste de mai jos intra in SUSPECT_EXTENSIONS. Cheia
# "script_extensions" nu a existat niciodata aici, desi analizorul o citea -
# `.get(cheie_gresita, [])` nu da eroare, doar tacere. Acum exista
# `require_keys` la pornire, care striga daca lipseste una asteptata.
executable_extensions: [exe, scr, com, pif, bat, cmd, js, jse, vbs, vbe, wsf, hta, lnk, msi, ps1]
macro_enabled_extensions: [docm, xlsm, pptm, dotm, xltm, xlam]
# ISO si IMG sunt un mod foarte folosit de livrare de malware, tocmai pentru ca
# trec de filtrele care se uita doar la .exe.
archive_extensions: [zip, rar, 7z, iso, img, cab]

# Tiparul de dubla extensie. Regex-ul prinde doar FORMA "pare document, dar mai
# are o extensie"; analizorul verifica dupa aceea ca extensia FINALA e una
# periculoasa. Fara verificarea a doua, raport.xls.pdf, poza.jpg.png si
# contract.doc.docx ieseau toate MALICIOUS.
suspicious_double_extension_pattern: '\.(pdf|doc|docx|xls|xlsx|jpg|png|txt)\.[a-z0-9]{2,4}$'
