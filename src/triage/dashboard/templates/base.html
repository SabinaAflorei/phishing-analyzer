<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Triaj Phishing{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
:root {
  --bg-color: #f8f9fa;
  --card-bg: #ffffff;
  --text-main: #212529;
  --text-muted: #718096;
  --border-color: #e3e6f0;
  --primary: #4e73df;
  --success: #1cc88a;
  --warning: #f6c23e;
  --danger: #e74a3b;
  --info: #36b9cc;
  --table-header-bg: #f1f5f9;
  --table-header-text: #475569;
  --table-row-hover: #f8fafc;
  --code-bg: #edf2f7;
  --code-text: #2d3748;
  --input-bg: #ffffff;
  --input-border: #cbd5e0;
  --shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.05);
}

[data-theme="dark"] {
  --bg-color: #0f1419;
  --card-bg: #1a2029;
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --border-color: #2d3748;
  --primary: #6d8dff;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --info: #38bdf8;
  --table-header-bg: #232b38;
  --table-header-text: #cbd5e0;
  --table-row-hover: #202836;
  --code-bg: #232b38;
  --code-text: #e2e8f0;
  --input-bg: #1a2029;
  --input-border: #3a4657;
  --shadow: 0 0.15rem 1.75rem 0 rgba(0, 0, 0, 0.3);
}

* { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  margin: 0;
  padding: 1.5rem 2rem;
  max-width: 1300px;
  margin-left: auto;
  margin-right: auto;
}

h1, h2, h3, h4 { margin-top: 0; color: var(--text-main); }

/* Layout & Cards */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1.25rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
}

/* Theme toggle */
.theme-toggle {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.theme-toggle:hover { border-color: var(--primary); }

/* Badges */
.badge {
  display: inline-block;
  padding: 0.35em 0.65em;
  font-size: 0.85em;
  font-weight: 700;
  border-radius: 4px;
  text-transform: uppercase;
}
[data-theme="light"] .SIMULATION,
:root:not([data-theme="dark"]) .SIMULATION { background-color: #e6f4ea; color: #137333; }
[data-theme="light"] .MALICIOUS,
:root:not([data-theme="dark"]) .MALICIOUS { background-color: #fce8e6; color: #c5221f; }
[data-theme="light"] .SPAM,
:root:not([data-theme="dark"]) .SPAM { background-color: #fef7e0; color: #b06000; }
[data-theme="light"] .LEGITIMATE,
:root:not([data-theme="dark"]) .LEGITIMATE { background-color: #e8f0fe; color: #1a73e8; }
[data-theme="light"] .NEEDS_REVIEW,
:root:not([data-theme="dark"]) .NEEDS_REVIEW { background-color: #f1f3f4; color: #5f6368; }

[data-theme="dark"] .SIMULATION { background-color: #14532d; color: #4ade80; }
[data-theme="dark"] .MALICIOUS { background-color: #4c1d1d; color: #f87171; }
[data-theme="dark"] .SPAM { background-color: #4a3a0a; color: #fbbf24; }
[data-theme="dark"] .LEGITIMATE { background-color: #1e3a5f; color: #60a5fa; }
[data-theme="dark"] .NEEDS_REVIEW { background-color: #2d3748; color: #cbd5e0; }

/* Tables */
table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
th { background-color: var(--table-header-bg); font-weight: 600; color: var(--table-header-text); }
tr:hover { background-color: var(--table-row-hover); }

/* Forms & Buttons */
select, textarea, button, input[type="text"] {
  font-family: inherit;
  font-size: 0.9rem;
  border-radius: 4px;
  background: var(--input-bg);
  color: var(--text-main);
  border: 1px solid var(--input-border);
}
button { cursor: pointer; border: none; font-weight: 600; }

code {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  font-size: 0.85em;
}
pre {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 1rem;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.88rem;
}

/* Confidence bar */
.confidence-wrap { display: flex; align-items: center; gap: 0.5rem; min-width: 90px; }
.confidence-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--border-color); overflow: hidden; }
.confidence-bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s ease; }
.confidence-bar-fill.low { background-color: var(--danger); }
.confidence-bar-fill.medium { background-color: var(--warning); }
.confidence-bar-fill.high { background-color: var(--success); }
.confidence-label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); min-width: 34px; text-align: right; }

/* Row touched marker */
.row-touched { border-left: 3px solid var(--primary); }
.touched-badge {
  display: inline-flex; align-items: center; gap: 0.25rem;
  font-size: 0.72rem; font-weight: 700; color: var(--primary);
  background: color-mix(in srgb, var(--primary) 15%, transparent);
  padding: 0.15rem 0.5rem; border-radius: 10px; margin-left: 0.4rem; white-space: nowrap;
}

/* Open button */
.btn-open {
  display: inline-flex; align-items: center; gap: 0.3rem;
  text-decoration: none; background: var(--code-bg); color: var(--text-main);
  padding: 5px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600;
}
.btn-open:hover { background: var(--primary); color: white; }

/* Bulk selection count */
#bulk-selection-count { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-left: auto; }
#bulk-selection-count.has-selection { color: var(--primary); }

/* Filter chips */
.filter-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
.filter-chip {
  cursor: pointer; border: 1px solid var(--border-color); background: var(--card-bg);
  padding: 5px 12px; border-radius: 16px; font-size: 0.82rem; font-weight: 600;
  color: var(--text-muted); user-select: none;
}
.filter-chip:hover { border-color: var(--primary); }
.filter-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
.filter-chip .count { opacity: 0.75; font-weight: 400; margin-left: 3px; }
tr.row-hidden { display: none; }

/* Evidence items */
.evidence-item { padding: 0.6rem 0.8rem; margin-bottom: 0.4rem; border-radius: 4px; border-left: 4px solid; font-size: 0.9rem; }
[data-theme="dark"] .evidence-item.severity-critical { background: #4c1d1d; border-color: #f87171; }
[data-theme="dark"] .evidence-item.severity-high { background: #452020; border-color: #fb923c; }
[data-theme="dark"] .evidence-item.severity-medium { background: #4a3a0a; border-color: #fbbf24; }
[data-theme="dark"] .evidence-item.severity-low { background: #232b38; border-color: #64748b; }
[data-theme="dark"] .evidence-item.severity-info { background: #1e2a4a; border-color: #818cf8; }

:root:not([data-theme="dark"]) .evidence-item.severity-critical { background: #fce8e6; border-color: #c5221f; }
:root:not([data-theme="dark"]) .evidence-item.severity-high { background: #fef1f0; border-color: #e74a3b; }
:root:not([data-theme="dark"]) .evidence-item.severity-medium { background: #fef7e0; border-color: #f6c23e; }
:root:not([data-theme="dark"]) .evidence-item.severity-low { background: #f1f5f9; border-color: #94a3b8; }
:root:not([data-theme="dark"]) .evidence-item.severity-info { background: #eef2ff; border-color: #6366f1; }

.evidence-severity-badge { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; margin-right: 0.4rem; color: var(--text-muted); }
.evidence-detail { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; font-family: monospace; word-break: break-all; }
</style>
</head>
<body>
<header style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
  <h1 style="font-size: 1.5rem; margin: 0;">Triaj Raportări Phishing</h1>
  <nav style="display: flex; align-items: center; gap: 1rem;">
    <a href="/" style="text-decoration: none; color: var(--primary); font-weight: 600;">Coada de Lucru</a>
    <a href="/stats" style="text-decoration: none; color: var(--primary); font-weight: 600;">Statistici</a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-label">Dark</span>
    </button>
  </nav>
</header>

{% block content %}{% endblock %}

<script>
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
    document.getElementById('theme-label').textContent = theme === 'dark' ? 'Light' : 'Dark';
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
}

(function () {
    const saved = localStorage.getItem('theme') || 'light';
    applyTheme(saved);
})();
</script>
</body>
</html>
