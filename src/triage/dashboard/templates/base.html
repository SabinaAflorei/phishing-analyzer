<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triaj phishing{% endblock %}</title>
  {# Totul local. Nicio resursa de pe internet - masina nu iese in retea. #}
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
  {# Inainte de primul paint, altfel ecranul palpaie alb la fiecare navigare. #}
  <script>
    try {
      var t = localStorage.getItem("triage-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">Triaj phishing <span>echipa de securitate</span></a>
      <nav class="topnav" aria-label="Principal">
        <a href="/" {% if active_page == 'queue' %}aria-current="page"{% endif %}>Coadă</a>
        <a href="/stats" {% if active_page == 'stats' %}aria-current="page"{% endif %}>Statistici</a>
        <button type="button" class="theme-toggle" id="theme-toggle"
                aria-pressed="false" title="Schimbă tema (deschis / întunecat)">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="visually-hidden">Schimbă tema</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="shell">
    {% if message %}
    <div class="notice" role="status">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      var root = document.documentElement;

      // Fara alegere explicita mergem dupa sistem, si ramanem dupa el: nu
      // scriem data-theme decat cand omul apasa efectiv butonul.
      function current() {
        if (root.dataset.theme) return root.dataset.theme;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function sync() { btn.setAttribute("aria-pressed", String(current() === "dark")); }

      sync();
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("triage-theme", next); } catch (e) {}
        sync();
      });
    })();
  </script>
</body>
</html>
