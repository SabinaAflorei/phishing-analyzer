<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triaj Phishing{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --border-color: #e3e6f0;
      --primary: #4e73df;
      --success: #1cc88a;
      --warning: #f6c23e;
      --danger: #e74a3b;
      --info: #36b9cc;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem 2rem;
      max-width: 1300px;
      margin-left: auto;
      margin-right: auto;
    }

    h1, h2, h3, h4 { margin-top: 0; color: #2e384d; }
    
    /* Layout & Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.05);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.35em 0.65em;
      font-size: 0.85em;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .SIMULATION { background-color: #e6f4ea; color: #137333; }
    .MALICIOUS { background-color: #fce8e6; color: #c5221f; }
    .SPAM { background-color: #fef7e0; color: #b06000; }
    .LEGITIMATE { background-color: #e8f0fe; color: #1a73e8; }
    .NEEDS_REVIEW { background-color: #f1f3f4; color: #5f6368; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { background-color: #f1f5f9; font-weight: 600; color: #475569; }
    tr:hover { background-color: #f8fafc; }

    /* Forms & Buttons */
    select, textarea, button { font-family: inherit; font-size: 0.9rem; border-radius: 4px; }
    button { cursor: pointer; border: none; font-weight: 600; }
    
    code { background: #edf2f7; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.85em; color: #2d3748; }
    pre { background: #2d3748; color: #f7fafc; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.5rem; margin: 0;"> Triaj Raportări Phishing</h1>
    <nav><a href="/" style="text-decoration: none; color: var(--primary); font-weight: 600;">Coada de Lucru</a> | <a href="/stats" style="text-decoration: none; color: var(--primary); font-weight: 600;">Statistici</a></nav>
  </header>
  
  {% block content %}{% endblock %}
</body>
</html>
