<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Triaj phishing{% endblock %}</title>
  {# Totul local. Nicio resursa de pe internet - masina nu iese in retea. #}
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">Triaj phishing <span>echipa de securitate</span></a>
      <nav class="topnav" aria-label="Principal">
        <a href="/" {% if active_page == 'queue' %}aria-current="page"{% endif %}>Coadă</a>
        <a href="/stats" {% if active_page == 'stats' %}aria-current="page"{% endif %}>Statistici</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    {% if message %}
    <div class="notice" role="status">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
